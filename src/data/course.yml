# Single source of truth for the course. The build fails if assessment weights
# do not sum to 100%, or if a CLO maps to an undeclared objective.

title: "Time Series Analysis and Forecasting"
short_name: "Time Series"
code: "EP16.TOKT11122"
type: "Compulsory"
credits: 3

canonical: "https://nghianguyen7171.github.io/ts_course/"

hours:
  lecture: 30
  lab: 15
  self_study: 90

department: "Faculty of Data Science and Artificial Intelligence"
university: "National Economics University"
university_url: "https://neu.edu.vn"
office: "Suite 1105, Building A1, NEU"

prerequisites:
  - "EP16.TOKT1145"
  - "EP16.TOKT11108"

description: |
  This course provides a practical introduction to time series analysis and
  forecasting with applications in finance, economics, and healthcare. Students
  use Python (NumPy, Pandas, Matplotlib, Statsmodels, scikit-learn, and
  optionally deep learning frameworks) to work with real-world time-indexed
  data.

  Core topics include time series concepts and components, exploratory analysis,
  stationarity, ARIMA and SARIMA models. In the later weeks, students are
  introduced to machine learning and deep learning methods for time series, such
  as tree-based models and simple recurrent or convolutional neural networks.

  The course is strongly project-based. Students work in groups on real datasets
  (stock prices, macroeconomic indicators, vital signs, EEG/ECG signals). All
  lab weeks are dedicated to project progress presentations. A Midterm Project
  Baseline Report replaces the traditional midterm exam and focuses on
  establishing strong classical baselines. The final deliverable is a
  comprehensive group project including both classical and ML/DL methods.

links:
  online_notes: "https://online.stat.psu.edu/stat510/"
  student_desk: "https://drive.google.com/drive/folders/1wMdddMAbIm2vQnrP7imtpy4y5yBBeEmX?usp=sharing"
  repo: "https://github.com/nghianguyen7171/ts_course"

student_desk:
  title: "Student Desk"
  subtitle: "Research Materials & Project Resources"
  items:
    - "Paper and poster templates for project submissions"
    - "Topic notebooks with detailed guidance for each project topic"
    - "Additional research materials and references"

objectives:
  - id: "G1"
    description: "Understand fundamental time series concepts and their applications in stock markets, finance, economics, and healthcare."
  - id: "G2"
    description: "Collect, preprocess, and manipulate time series data in Python using appropriate libraries."
  - id: "G3"
    description: "Conduct exploratory time series analysis, including visualization, decomposition, and stationarity assessment."
  - id: "G4"
    description: "Model and forecast time series data using core statistical methods such as ARIMA and SARIMA."
  - id: "G5"
    description: "Apply and compare traditional time series models with basic machine learning and deep learning methods for forecasting."
  - id: "G6"
    description: "Develop teamwork, self-study, independent work, and shared responsibility within project groups through a project-based learning approach."

learning_outcomes:
  - id: "CLO 1.1"
    objective: "G1"
    description: "Explain key time series concepts (trend, seasonality, cyclicity, noise) and their relevance in real-world applications."
  - id: "CLO 1.2"
    objective: "G2"
    description: "Use Python (Pandas, NumPy, Matplotlib, Statsmodels) to load, preprocess, and visualize time series data."
  - id: "CLO 2.1"
    objective: "G3"
    description: "Perform exploratory analysis of time series using ACF/PACF, decomposition, and smoothing techniques."
  - id: "CLO 3.1"
    objective: "G3"
    description: "Explain the concept of stationarity and apply differencing and basic tests (e.g. ADF) to assess it."
  - id: "CLO 3.2"
    objective: "G4"
    description: "Build and interpret AR, MA, and ARMA models and implement them in Python."
  - id: "CLO 4.1"
    objective: "G4"
    description: "Build, evaluate, and diagnose ARIMA and SARIMA models using the Box–Jenkins methodology."
  - id: "CLO 4.2"
    objective: "G5"
    description: "Transform time series into supervised learning format and implement basic machine learning models for forecasting."
  - id: "CLO 4.3"
    objective: "G5"
    description: "Describe the role of deep learning models (RNN/LSTM/CNN) for time series and implement a simple example."
  - id: "CLO 5.1"
    objective: "G5"
    description: "Design and implement a complete forecasting pipeline on a real dataset, combining classical and ML/DL approaches."
  - id: "CLO 5.2"
    objective: "G5"
    description: "Analyze and interpret model results, compare methods, and provide actionable insights."
  - id: "CLO 6.1"
    objective: "G6"
    description: "Demonstrate self-study and independent work through homework and project contributions."
  - id: "CLO 6.2"
    objective: "G6"
    description: "Collaborate effectively in teams and report project progress clearly in written and oral form."

# 20 + 30 + 50 = 100. The build enforces this.
assessment:
  items:
    - name: "Homework"
      content: "Theory and programming (individual)"
      week: "Selected weeks"
      weight: "20%"
      clos: "1.2, 2.1, 3.1, 3.2, 4.1, 4.2, 4.3, 6.1"
      criteria: "LMS submission; correctness; application to time series; time management."
    - name: "Midterm Project Baseline"
      content: "Group baseline report (PDF) + presentation"
      week: "Week 10"
      weight: "30%"
      clos: "1.2–4.1, 5.1, 5.2, 6.1, 6.2"
      criteria: "EDA, ARIMA/SARIMA baseline, forecasts and plots; clarity and structure."
    - name: "Final Project"
      content: "Full group project report + final presentation"
      week: "Week 15"
      weight: "50%"
      clos: "1.1–5.2, 6.1, 6.2"
      criteria: "Integration of classical and ML/DL models; depth; comparison; clarity; teamwork."
  notes:
    - "All lab weeks are used for group progress presentations. These count toward the overall project evaluation (midterm and final), not as separate lab assignments."
    - "The Midterm Project Baseline replaces a traditional written exam and focuses on producing a strong classical (ARIMA/SARIMA) baseline."

